name: CI-CD - Gateway Service

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: CI - Build & Push Docker
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/apigateway
          VERSION=${{ env.VERSION }}

          echo "Building image $IMAGE:$VERSION"

          docker build \
            --build-arg APP_VERSION=$VERSION \
            -t $IMAGE:$VERSION .

          docker push $IMAGE:$VERSION

  deploy:
    name: CD - Deploy to Kubernetes
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Extract version (same tag)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Deploy to K8s
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/apigateway

          echo "Deploying $IMAGE:$VERSION to Kubernetes"

          kubectl set image deployment/gateway-service \
            gateway-service=$IMAGE:$VERSION \
            -n dev

          kubectl rollout status deployment/gateway-service -n dev