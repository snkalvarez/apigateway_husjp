name: Release - Production

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-22.04
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build (PROD)
        run: |
          chmod +x gradlew
          ./gradlew clean build
        env:
          APP_VERSION: ${{ env.VERSION }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker (PROD)
        run: |
          docker build \
            --build-arg APP_VERSION=${{ env.VERSION }} \
            --build-arg PROFILE=prod \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/microservices:${{ env.VERSION }} .
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/microservices:${{ env.VERSION }}
